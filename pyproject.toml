[project]
name = "optimal-quad-control-rl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "drake>=1.44.0",
    "ipykernel>=6.30.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.5",
    "numpy>=2.2.6",
    "opencv-python>=4.11.0.86",
    "scipy>=1.15.3",
    "setuptools>=80.9.0",
    "stable-baselines3[extra]>=2.7.0",
    "sympy>=1.14.0",
    "tensorboard>=2.20.0",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "wheel>=0.45.1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]